<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Contact me — Frank Evbota</title>
    <meta name="description" content="Get in touch with Frank Evbota, Product Designer." />
    <link rel="icon" href="assets/images/icons/favicon-light.svg" />
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/brand.css" />
    <link rel="stylesheet" href="assets/css/page-transitions.css" />
    <script>document.documentElement.classList.add("fe-anim-ready");</script>
  </head>
  <body>
    <a class="fe-skip-link" href="#main-content">Skip to main content</a>
    <header class="fe-header">
      <div class="fe-header__inner">
        <a class="fe-logo" href="index.html">fe.</a>
        <button class="fe-burger" type="button" aria-label="Open menu" data-fe-menu>
          <span></span><span></span><span></span>
        </button>
        <nav class="fe-nav" data-fe-nav>
          <a href="index.html">Home</a>
          <a href="projects.html">Projects</a>
          <a href="https://rxresu.me/onefranc/franklin-evbota-ux-resume" target="_blank" rel="noopener noreferrer">Download CV</a>
          <a class="fe-nav__cta fe-nav__cta--secondary is-active" href="contact-me.html">Contact me</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="fe-contact fe-rhythm" data-animate="up">
        <div class="fe-contact__frame">
          <div class="fe-globe" aria-label="Globe">
            <canvas class="fe-globe__canvas" aria-hidden="true" width="600" height="600"></canvas>
          </div>
          <div class="fe-contact__content">
            <h1>Get in touch</h1>
            <p class="fe-contact__lead">
              Feel free to reach out if you want to have a chat, or have any
              questions.
            </p>

            <form class="fe-form" action="https://formsubmit.co/reachevbotafranklin@gmail.com" method="post" enctype="text/plain">
              <div>
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Your name…" autocomplete="name" required />
              </div>
              <div>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@company.com…" autocomplete="email" required />
              </div>
              <div>
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell me about your project…" autocomplete="off" required></textarea>
              </div>
              <div>
                <button class="fe-btn fe-btn--dark" type="submit">Send message</button>
              </div>
            </form>

            <div class="fe-contact-links" id="download">
              <a class="fe-btn fe-btn--ghost" href="https://rxresu.me/onefranc/franklin-evbota-ux-resume">Download CV</a>
              <a class="fe-btn fe-btn--ghost" href="projects.html">View projects</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="fe-footer fe-footer--contact">
      <div class="fe-footer__inner">
        <nav class="fe-footer__nav" aria-label="Footer">
          <a href="index.html">Home</a>
          <a href="projects.html">Projects</a>
          <a href="contact-me.html">Contact me</a>
        </nav>
        <div class="fe-footer__legal">
          <span>Copyright © 2025 Evbota Franklin. All rights reserved.</span>
        </div>
      </div>
    </footer>
    <script src="assets/js/scroll-animations.js"></script>
    <script src="assets/js/page-transitions.js"></script>
    <script src="assets/js/globe.js"></script>
  </body>
</html>
