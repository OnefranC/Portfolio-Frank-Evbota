    <header class="fe-header">
      <div class="fe-header__inner">
        <a class="fe-logo" href="index.html">fe.</a>

    <main>
      <section class="fe-contact" data-animate="up">
        <h1>Get in touch</h1>
        <p class="fe-contact__lead">
          Feel free to reach out if you want to have a chat, or have any
          questions.
        </p>

        <form class="fe-form" action="mailto:reachevbotafranklin@gmail.com" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@company.com" required />
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell me about your project..." required></textarea>
          </div>
          <div>
            <button class="fe-btn fe-btn--dark" type="submit">Send message</button>
          </div>
        </form>

        <div class="fe-contact-links" id="download">
          <a class="fe-btn fe-btn--ghost" href="https://rxresu.me/onefranc/franklin-evbota-ux-resume">Download CV</a>
          <a class="fe-btn fe-btn--ghost" href="projects.html">View projects</a>
